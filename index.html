<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e0c" />
    <title>%COPY_PAGE_TITLE%</title>
    <meta name="description" content="%COPY_DESCRIPTION%" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%COPY_SITE_NAME%" />
    <meta property="og:title" content="%COPY_PAGE_TITLE%" />
    <meta property="og:description" content="%COPY_DESCRIPTION%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%COPY_SHARE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%COPY_PAGE_TITLE%" />
    <meta name="twitter:description" content="%COPY_DESCRIPTION%" />
    <meta name="twitter:image:alt" content="%COPY_SHARE_ALT%" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preload" href="%BASE_URL%fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="title-block" id="title-block">
      <p class="title-block__kicker">%COPY_KICKER%</p>
      <h1 class="title-block__title">%COPY_TITLE%</h1>
      <p class="title-block__hook">
        <s class="title-block__wrong">%COPY_YOUD_THINK%</s>
        <span class="title-block__right">%COPY_ACTUALLY%</span>
      </p>
    </header>
    <noscript>
      <div class="no-script">
        <p>%COPY_NOSCRIPT_NEEDS%</p>
        <p>%COPY_NOSCRIPT_IDEA%</p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
