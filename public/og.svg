<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Standing Wave — Same speaker, different bass</title>
  <desc id="description">A stylized rectangular room with amber pressure peaks at its opposite ends and a dark, quiet plane through the middle.</desc>
  <defs>
    <radialGradient id="backdrop" cx="74%" cy="50%" r="75%">
      <stop stop-color="#193033"/>
      <stop offset="1" stop-color="#080f12"/>
    </radialGradient>
    <linearGradient id="pressure">
      <stop stop-color="#edb578"/>
      <stop offset=".22" stop-color="#a56631"/>
      <stop offset=".45" stop-color="#102024"/>
      <stop offset=".55" stop-color="#102024"/>
      <stop offset=".78" stop-color="#a56631"/>
      <stop offset="1" stop-color="#edb578"/>
    </linearGradient>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#edb578" stop-opacity=".03"/>
      <stop offset="1" stop-color="#edb578" stop-opacity=".23"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#080f12"/>
  <rect width="1200" height="630" fill="url(#backdrop)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(60 56)" stroke="#edb578" fill="none" stroke-width="1.8">
      <path d="M0 16C6-2 12-2 18 16S30 34 36 16M0 16C6 34 12 34 18 16S30-2 36 16"/>
      <path d="M0 16h36" opacity=".3" stroke-width=".7"/>
    </g>
    <text x="111" y="81" fill="#e7eceb" font-size="27" font-weight="600" letter-spacing="-1">Standing Wave.</text>
    <text x="1140" y="77" fill="#7e9297" font-size="11" letter-spacing="2" text-anchor="end">AN INTERACTIVE SOUND LAB</text>
    <path d="M60 112H1140" stroke="#385053" stroke-opacity=".6"/>

    <text x="60" y="189" fill="#8ea8aa" font-size="11" letter-spacing="2.4">THE ROOM PLAYS ALONG</text>
    <text x="57" y="265" fill="#e7eceb" font-size="56" letter-spacing="-2.5">Same speaker.</text>
    <text x="57" y="329" fill="#edb578" font-size="56" letter-spacing="-2.5">Different bass.</text>
    <text x="60" y="386" fill="#aebfbd" font-size="21">Find the loud peaks.</text>
    <text x="60" y="417" fill="#aebfbd" font-size="21">Move through the quiet spots.</text>
    <path d="M60 489H100" stroke="#9fe0ce" stroke-width="2"/>
    <text x="60" y="518" fill="#9fe0ce" font-size="12" letter-spacing="1.5">SCRUB FREQUENCY. MOVE THE MIC.</text>

    <path d="M654 379 850 524 1142 430 1142 439 850 534 654 389Z" fill="#050b0e"/>
    <g transform="matrix(285 -90 190 140 660 375)">
      <rect width="1" height="1" fill="url(#pressure)"/>
      <path d="M.25 0V1M.5 0V1M.75 0V1M0 .25H1M0 .5H1M0 .75H1" stroke="#9fb1af" stroke-opacity=".12" stroke-width=".7" vector-effect="non-scaling-stroke"/>
    </g>
    <path d="M660 230 850 370 850 515 660 375Z M945 140 1135 280 1135 425 945 285Z" fill="url(#wall)" stroke="#c59862" stroke-opacity=".35"/>
    <path d="M660 230 945 140 1135 280 850 370Z M660 375 945 285 1135 425 850 515Z M660 230V375M945 140V285M1135 280V425M850 370V515" fill="none" stroke="#6b8b90" stroke-opacity=".65" stroke-width="1.2"/>
    <path d="M802.5 185 992.5 325 992.5 470 802.5 330Z" fill="#a6d4d8" fill-opacity=".03" stroke="#8db9be" stroke-width="1.2" stroke-dasharray="4 5"/>

    <rect x="756" y="194" width="125" height="29" rx="3" fill="#0c1a1e"/>
    <text x="818" y="213" fill="#a6d4d8" font-size="10" text-anchor="middle" letter-spacing="1.6">NODE / QUIET</text>
    <rect x="996" y="270" width="144" height="29" rx="3" fill="#151d1b"/>
    <text x="1068" y="289" fill="#edb578" font-size="10" text-anchor="middle" letter-spacing="1.4">ANTINODE / LOUD</text>

    <ellipse cx="1038" cy="408" rx="20" ry="9" fill="#10251f" stroke="#9fe0ce" stroke-opacity=".65"/>
    <path d="M1038 408V346" stroke="#a6d9c2" stroke-width="2"/>
    <rect x="1033" y="338" width="10" height="19" rx="5" fill="#b9ffdc"/>
    <circle cx="1038" cy="340" r="4" fill="#edfff6"/>
    <text x="1038" y="325" fill="#b9ffdc" font-size="10" letter-spacing="1.7" text-anchor="middle">LISTENER</text>

    <path d="M60 562H1140" stroke="#385053" stroke-opacity=".6"/>
    <text x="60" y="591" fill="#7e9297" font-size="11" letter-spacing="1.4">STANDING PRESSURE · SIMPLIFIED ROOM MODES</text>
    <text x="1140" y="591" fill="#7e9297" font-size="11" letter-spacing="1.4" text-anchor="end">6.0 × 4.0 × 2.8 m</text>
  </g>
</svg>
