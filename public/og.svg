<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Standing Wave — Same speaker. Different bass.</title>
  <desc id="description">Standing Wave: same speaker, different bass. A rectangular room has glowing amber pressure peaks labeled ANTINODE / LOUD at its ends and a dark central plane labeled NODE / QUIET. A prominent mint microphone is labeled LISTENER. Scrub frequency. Move the mic.</desc>
  <defs>
    <radialGradient id="atmosphere" cx="58%" cy="64%" r="65%">
      <stop stop-color="#203334"/>
      <stop offset=".57" stop-color="#101c20"/>
      <stop offset="1" stop-color="#080f12"/>
    </radialGradient>
    <linearGradient id="back-wall" x1="332" y1="0" x2="935" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b633e"/>
      <stop offset=".14" stop-color="#3c3024"/>
      <stop offset=".4" stop-color="#0a1316"/>
      <stop offset=".6" stop-color="#0a1316"/>
      <stop offset=".87" stop-color="#403326"/>
      <stop offset="1" stop-color="#a87845"/>
    </linearGradient>
    <linearGradient id="wall-shade" x1="0" y1="205" x2="0" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080f12" stop-opacity=".52"/>
      <stop offset=".7" stop-color="#080f12" stop-opacity="0"/>
      <stop offset="1" stop-color="#04090b" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="floor" x1="212" y1="455" x2="995" y2="515" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2a565"/>
      <stop offset=".13" stop-color="#a26d3e"/>
      <stop offset=".3" stop-color="#3a3024"/>
      <stop offset=".43" stop-color="#0b1417"/>
      <stop offset=".55" stop-color="#0b1417"/>
      <stop offset=".7" stop-color="#3b3024"/>
      <stop offset=".88" stop-color="#aa7543"/>
      <stop offset="1" stop-color="#edb578"/>
    </linearGradient>
    <linearGradient id="end-wall" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#1b2b2c"/>
      <stop offset=".3" stop-color="#4a493a"/>
      <stop offset=".72" stop-color="#a77b4b"/>
      <stop offset="1" stop-color="#edb578"/>
    </linearGradient>
    <radialGradient id="left-end-light" cx="85%" cy="64%" r="85%">
      <stop stop-color="#ffdda8" stop-opacity=".64"/>
      <stop offset=".45" stop-color="#edb578" stop-opacity=".18"/>
      <stop offset="1" stop-color="#edb578" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right-end-light" cx="0%" cy="67%" r="95%">
      <stop stop-color="#ffdda8" stop-opacity=".64"/>
      <stop offset=".45" stop-color="#edb578" stop-opacity=".18"/>
      <stop offset="1" stop-color="#edb578" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-haze">
      <stop stop-color="#edb578" stop-opacity=".47"/>
      <stop offset=".5" stop-color="#d9954a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c9823b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor-light">
      <stop stop-color="#ffe0a9" stop-opacity=".65"/>
      <stop offset=".4" stop-color="#edb578" stop-opacity=".25"/>
      <stop offset="1" stop-color="#edb578" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="195" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edb578"/>
      <stop offset=".35" stop-color="#43514e"/>
      <stop offset=".5" stop-color="#142329"/>
      <stop offset=".65" stop-color="#47554e"/>
      <stop offset="1" stop-color="#edb578"/>
    </linearGradient>
    <linearGradient id="fascia" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1c272a"/>
      <stop offset="1" stop-color="#050b0e"/>
    </linearGradient>
    <radialGradient id="mint-halo">
      <stop stop-color="#9fe0ce" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fe0ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground-shadow">
      <stop stop-color="#03080a" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#03080a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#03080a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node-plane" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#182e35" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#101e23" stop-opacity=".22"/>
      <stop offset="1" stop-color="#365a60" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="mic-metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ca18f"/>
      <stop offset=".4" stop-color="#d9fff0"/>
      <stop offset="1" stop-color="#80cbb5"/>
    </linearGradient>
    <filter id="bloom" x="-60%" y="-50%" width="220%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="room-clip">
      <path d="M152 320 332 205 935 226 1037 366 990 582 195 519Z"/>
    </clipPath>
    <clipPath id="floor-clip">
      <path d="M195 519 351 354 910 385 990 582Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#080f12"/>
  <rect width="1200" height="630" fill="url(#atmosphere)"/>
  <g transform="translate(0 38) scale(1 .8)">
    <ellipse cx="603" cy="565" rx="484" ry="60" fill="url(#ground-shadow)"/>

    <path d="M195 519 990 582 989 596 194 533Z" fill="url(#fascia)"/>
    <path d="M332 205 935 226 910 385 351 354Z" fill="url(#back-wall)"/>
    <path d="M332 205 935 226 910 385 351 354Z" fill="url(#wall-shade)"/>
    <path d="M195 519 351 354 910 385 990 582Z" fill="url(#floor)"/>
    <g clip-path="url(#floor-clip)">
      <ellipse cx="246" cy="456" rx="275" ry="149" fill="url(#floor-light)" transform="rotate(-20 246 456)"/>
      <ellipse cx="973" cy="497" rx="254" ry="166" fill="url(#floor-light)" transform="rotate(16 973 497)"/>
      <path d="M351 354 910 385" fill="none" stroke="#050b0e" stroke-width="16" opacity=".55" filter="url(#soft)"/>
      <path d="M255 456 958 504M307 401 933 440" fill="none" stroke="#f6cf98" stroke-opacity=".09"/>
    </g>

    <path d="M152 320 332 205 351 354 195 519Z" fill="url(#end-wall)"/>
    <path d="M935 226 1037 366 990 582 910 385Z" fill="url(#end-wall)"/>
    <path d="M152 320 332 205 351 354 195 519Z" fill="url(#left-end-light)"/>
    <path d="M935 226 1037 366 990 582 910 385Z" fill="url(#right-end-light)"/>

    <!-- Light is an illustration of pressure amplitude, not a ray simulation. -->
    <g clip-path="url(#room-clip)">
      <ellipse cx="292" cy="386" rx="240" ry="221" fill="url(#amber-haze)"/>
      <ellipse cx="949" cy="409" rx="234" ry="226" fill="url(#amber-haze)"/>
      <path d="M332 213 348 355 199 511M936 233 913 385 988 574" fill="none" stroke="#edb578" stroke-width="23" opacity=".7" filter="url(#bloom)"/>
      <path d="M345 225 361 357 230 512M922 238 900 384 959 575" fill="none" stroke="#ffe0b0" stroke-width="7" opacity=".28" filter="url(#soft)"/>
      <g fill="#ffe0ad">
        <g opacity=".75">
          <circle cx="280" cy="338" r="2.6"/><circle cx="287" cy="386" r="2.6"/><circle cx="294" cy="435" r="2.6"/>
          <circle cx="328" cy="307" r="2.4"/><circle cx="333" cy="350" r="2.4"/><circle cx="338" cy="393" r="2.4"/>
          <circle cx="912" cy="322" r="2.4"/><circle cx="909" cy="370" r="2.4"/><circle cx="907" cy="417" r="2.4"/>
          <circle cx="963" cy="387" r="2.6"/><circle cx="953" cy="438" r="2.6"/><circle cx="943" cy="489" r="2.6"/>
        </g>
        <g opacity=".4">
          <circle cx="366" cy="347" r="2.2"/><circle cx="370" cy="395" r="2.2"/><circle cx="375" cy="446" r="2.2"/>
          <circle cx="398" cy="312" r="2"/><circle cx="402" cy="356" r="2"/><circle cx="406" cy="400" r="2"/>
          <circle cx="844" cy="319" r="2"/><circle cx="843" cy="367" r="2"/><circle cx="842" cy="414" r="2"/>
          <circle cx="873" cy="380" r="2.2"/><circle cx="869" cy="431" r="2.2"/><circle cx="865" cy="482" r="2.2"/>
        </g>
        <g opacity=".15">
          <circle cx="442" cy="352" r="1.8"/><circle cx="444" cy="402" r="1.8"/><circle cx="446" cy="453" r="1.8"/>
          <circle cx="780" cy="328" r="1.8"/><circle cx="779" cy="376" r="1.8"/><circle cx="779" cy="423" r="1.8"/>
        </g>
      </g>
    </g>

    <g fill="none" stroke-linejoin="round">
      <path d="M153 320 332 205 935 226 1037 366" stroke="#a1b6b1" stroke-opacity=".36"/>
      <path d="M153 320 195 519 351 354 332 205M935 226 910 385 990 582 1037 366" stroke="#ffe0ae" stroke-opacity=".65" stroke-width="1.5"/>
      <path d="M351 354 910 385" stroke="url(#rim)" stroke-opacity=".3"/>
      <path d="M195 519 990 582" stroke="url(#rim)" stroke-width="1.5"/>
      <path d="M196 533 989 596" stroke="#47605f" stroke-opacity=".13"/>
    </g>

    <path d="M622 215 568 342 571 549 620 369Z" fill="url(#node-plane)"/>
    <path d="M622 215 568 342 571 549 620 369Z" fill="none" stroke="#90acb2" stroke-opacity=".72" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M568 342 571 549" stroke="#c0d0d2" stroke-opacity=".6" stroke-width="2"/>

    <g>
      <ellipse cx="297" cy="476" rx="32" ry="12" fill="#070d0e" opacity=".8" filter="url(#soft)"/>
      <path d="M281 408 310 414 310 474 281 467Z" fill="#152327" stroke="#6b8179" stroke-width="1.5"/>
      <path d="M310 414 321 402 321 459 310 474Z" fill="#0a1519" stroke="#53645b"/>
      <path d="M281 408 293 397 321 402 310 414Z" fill="#304039"/>
      <ellipse cx="296" cy="443" rx="10" ry="15" fill="#0b1216" stroke="#bd9b69" stroke-width="1.5"/>
      <ellipse cx="296" cy="443" rx="4" ry="7" fill="#65756c"/>
      <circle cx="295" cy="422" r="3" fill="#0b1216" stroke="#a18c69"/>
    </g>
  </g>

  <g>
    <ellipse cx="805" cy="459" rx="49" ry="14" fill="#060e11" opacity=".65" filter="url(#soft)"/>
    <ellipse cx="805" cy="450" rx="54" ry="28" fill="url(#mint-halo)"/>
    <ellipse cx="805" cy="450" rx="24" ry="9" fill="#142c2c" stroke="#9fe0ce" stroke-width="2"/>
    <rect x="802.5" y="400" width="5" height="48" fill="url(#mic-metal)"/>
    <rect x="793" y="358" width="24" height="46" rx="12" fill="#9fe0ce" opacity=".65" filter="url(#soft)"/>
    <rect x="795" y="359" width="20" height="43" rx="10" fill="url(#mic-metal)"/>
    <path d="M799 369H811M799 375H811M799 381H811M799 387H811" stroke="#447e70" stroke-width="2" stroke-linecap="round"/>
    <path d="M788 386V392Q788 409 805 409Q822 409 822 392V386" fill="none" stroke="#9fe0ce" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="118" y="121" fill="#edf1ec" font-size="72" font-weight="600" letter-spacing="-3.5">Standing Wave</text>
    <text x="122" y="168" fill="#c0cbc7" font-size="36" letter-spacing="-.7">Same speaker. <tspan fill="#edb578">Different bass.</tspan></text>

    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M262 225V299L305 333" stroke="#edb578"/>
      <circle cx="305" cy="333" r="4" fill="#edb578" stroke="#edb578"/>
      <path d="M603 227V306L586 329" stroke="#b6cbd0"/>
      <circle cx="586" cy="329" r="4" fill="#b6cbd0" stroke="#b6cbd0"/>
      <path d="M805 312V347" stroke="#9fe0ce"/>
    </g>
    <g font-size="36" font-weight="600" letter-spacing="-.7" paint-order="stroke" stroke="#0c1417" stroke-width="2" stroke-linejoin="round">
      <text x="129" y="211" fill="#edb578">ANTINODE / LOUD</text>
      <text x="480" y="211" fill="#d1e0e1">NODE / QUIET</text>
      <text x="805" y="300" fill="#9fe0ce" text-anchor="middle">LISTENER</text>
    </g>

    <text x="122" y="554" fill="#bfe9db" font-size="36" letter-spacing="-.6">Scrub frequency. Move the mic.</text>
  </g>
</svg>
